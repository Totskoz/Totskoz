name: Update banner

on:
  schedule:
    - cron: '17 5 * * *' # daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check for token
        id: token
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: |
          if [ -z "$PROFILE_TOKEN" ]; then
            echo "::warning::PROFILE_TOKEN secret is not set - skipping update (see README)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Fetch contributions and rebuild
        if: steps.token.outputs.present == 'true'
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: npm run update
      - name: Commit
        if: steps.token.outputs.present == 'true'
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "Update banner"
            git push
          fi
